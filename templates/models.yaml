# Which model runs each zforge phase, per coding assistant.
#
# zforge names no model of its own: a phase without an entry here runs on
# the client's default — for Claude Code, the model you chose with /model or
# in its settings; for Codex and OpenCode, their configured default.
#
# Choose with:   zforge models set <phase|all> <model> [--client claude] [--global]
# See choices:   zforge models
# or edit this file. Phases: spec, testspec, plan, code, review.
# ~/.zforge/models.yaml applies to every project; this file wins over it.
#
# Example:
#
# claude:
#   plan: opus
#   code: sonnet
#   review: opus
#
# codex:
#   code: <model>
#
# opencode:
#   code: <provider>/<model>
