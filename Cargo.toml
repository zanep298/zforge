[package]
name = "zforge"
version = "0.0.5"
edition = "2021"
description = "TDD-first AI development workflow CLI"
license = "MIT"
repository = "https://github.com/zanep298/zforge"
keywords = ["cli", "tdd", "ai", "workflow", "development"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.74"

[[bin]]
name = "zforge"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
colored = "2"
arboard = "3"
walkdir = "2"
dirs = "5"
regex = "1"
serde_json = "1"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
assert_fs = "1"
