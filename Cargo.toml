[package]
name = "zforge"
version = "1.5.0"
edition = "2021"
description = "Human-reviewed AI development CLI: intake → review → handover, then agents code and verify each task in its own git worktree"
license = "MIT"
repository = "https://github.com/zanep298/zforge"
keywords = ["cli", "ai", "agents", "workflow", "code-review"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.74"

[[bin]]
name = "zforge"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
colored = "2"
dirs = "5"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", features = ["json"] }
shlex = "1"
wait-timeout = "0.2"
indexmap = { version = "2", features = ["serde"] }
which = "6"
fs2 = "0.4"
libc = "0.2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
assert_fs = "1"
serial_test = "3"
