name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/zforge dist/
          cp README.md LICENSE dist/ 2>/dev/null || true
          cd dist
          tar czf ../zforge-${{ matrix.target }}.tar.gz *

      - name: Package (windows)
        if: matrix.archive == 'zip'
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\zforge.exe dist\
          copy README.md dist\ 2>nul || true
          cd dist
          7z a ..\zforge-${{ matrix.target }}.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zforge-${{ matrix.target }}
          path: |
            zforge-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          generate_release_notes: true

  update-homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256s
        id: sha
        run: |
          echo "arm64=$(sha256sum artifacts/zforge-aarch64-apple-darwin.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "x86_darwin=$(sha256sum artifacts/zforge-x86_64-apple-darwin.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux=$(sha256sum artifacts/zforge-x86_64-unknown-linux-gnu.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: zanep298/homebrew
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          SHA_ARM64="${{ steps.sha.outputs.arm64 }}"
          SHA_X86_DARWIN="${{ steps.sha.outputs.x86_darwin }}"
          SHA_LINUX="${{ steps.sha.outputs.linux }}"
          cd tap
          python3 - "$VERSION" "$SHA_ARM64" "$SHA_X86_DARWIN" "$SHA_LINUX" <<'EOF'
          import re, sys

          version, sha_arm, sha_x86, sha_linux = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]

          path = "Formula/zf.rb"
          src  = open(path).read()

          src = re.sub(r'version ".*?"', f'version "{version}"', src)
          src = re.sub(r'sha256 "[0-9a-f]{64}"', f'sha256 "PLACEHOLDER"', src)

          # replace placeholders in order: arm64, x86_darwin, linux
          src = src.replace('sha256 "PLACEHOLDER"', f'sha256 "{sha_arm}"',   1)
          src = src.replace('sha256 "PLACEHOLDER"', f'sha256 "{sha_x86}"',   1)
          src = src.replace('sha256 "PLACEHOLDER"', f'sha256 "{sha_linux}"', 1)

          # handle initial PLACEHOLDER_ strings too
          src = src.replace('sha256 "PLACEHOLDER_SHA256_ARM64"',        f'sha256 "{sha_arm}"')
          src = src.replace('sha256 "PLACEHOLDER_SHA256_X86_64_DARWIN"', f'sha256 "{sha_x86}"')
          src = src.replace('sha256 "PLACEHOLDER_SHA256_LINUX"',         f'sha256 "{sha_linux}"')

          open(path, "w").write(src)
          print(f"Updated zf.rb → version={version}")
          EOF

      - name: Commit and push
        run: |
          cd tap
          git config user.name "zanep298"
          git config user.email "minh.tan2908@gmail.com"
          git add Formula/zf.rb
          git commit -m "zf ${{ github.ref_name }}"
          git push
